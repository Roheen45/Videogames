<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Game Sales · ML demo</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #172033; background: #f4f6fb; }
    body { max-width: 880px; margin: 48px auto; padding: 0 20px; }
    h1 { margin-bottom: 8px; } .intro { color: #596579; margin-bottom: 28px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 18px; }
    section { background: white; border: 1px solid #e0e5ee; border-radius: 14px; padding: 22px; box-shadow: 0 8px 24px #1c2d4a0b; }
    label { display:block; margin: 12px 0 5px; font-size: .92rem; }
    input, select, button { box-sizing: border-box; width:100%; padding: 10px; border:1px solid #cbd3e0; border-radius:8px; font:inherit; }
    button { margin-top:16px; border:0; background:#315be8; color:white; font-weight:650; cursor:pointer; }
    button:hover { background:#2448c6; } output { display:block; min-height:24px; margin-top:14px; color:#24543d; font-weight:600; }
    .note { font-size:.86rem; color:#687387; }
  </style>
</head>
<body>
  <h1>Video game sales ML demo</h1>
  <p class="intro">Try two small models trained from the supplied video game sales dataset.</p>
  <div class="grid">
    <section>
      <h2>Estimate global sales</h2>
      <p class="note">Enter regional sales in millions. The model estimates global sales.</p>
      <form id="regression-form">
        <label>North America sales <input name="na_sales" type="number" min="0" step="0.01" value="1.2" required></label>
        <label>Europe sales <input name="eu_sales" type="number" min="0" step="0.01" value="0.8" required></label>
        <label>Japan sales <input name="jp_sales" type="number" min="0" step="0.01" value="0.3" required></label>
        <label>Other regions sales <input name="other_sales" type="number" min="0" step="0.01" value="0.2" required></label>
        <button>Predict sales</button><output aria-live="polite"></output>
      </form>
    </section>
    <section>
      <h2>Predict a game genre</h2>
      <p class="note">Choose a platform and release year.</p>
      <form id="classification-form">
        <label>Platform <select name="platform">
          <option>PS2</option><option>DS</option><option>Wii</option><option>PS3</option><option>X360</option><option>PS</option><option>GBA</option><option>PS4</option><option>3DS</option><option>PC</option><option>Switch</option>
        </select></label>
        <label>Release year <input name="year" type="number" min="1980" max="2035" value="2010" required></label>
        <button>Predict genre</button><output aria-live="polite"></output>
      </form>
    </section>
  </div>
  <script>
    async function submitPrediction(form, endpoint, transform) {
      const output = form.querySelector('output');
      const button = form.querySelector('button');
      const body = transform(Object.fromEntries(new FormData(form)));
      output.textContent = 'Predicting…'; button.disabled = true;
      try {
        const response = await fetch(endpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail?.[0]?.msg || 'Request failed');
        output.textContent = endpoint.endsWith('regression') ? `Estimated global sales: ${result.prediction} million` : `Predicted genre: ${result.prediction}`;
      } catch (error) { output.textContent = `Error: ${error.message}. Is the API running?`; }
      finally { button.disabled = false; }
    }
    document.querySelector('#regression-form').addEventListener('submit', event => {
      event.preventDefault(); submitPrediction(event.currentTarget, '/predict/regression', values => Object.fromEntries(Object.entries(values).map(([key, value]) => [key, Number(value)])));
    });
    document.querySelector('#classification-form').addEventListener('submit', event => {
      event.preventDefault(); submitPrediction(event.currentTarget, '/predict/classification', values => ({...values, year:Number(values.year)}));
    });
  </script>
</body>
</html>
